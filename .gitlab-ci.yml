# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
build:
  stage: test
  image: debian:trixie
  parallel:
    matrix:
      - CXX: [g++, clang++]
        BUILD_TYPE: [debug, release]
  before_script:
    - apt-get update && apt-get install -y g++ clang meson ninja-build pkg-config guile-3.0-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev libxkbcommon-x11-dev libxcb-xtest0-dev libjq-dev libpango1.0-dev ruby xvfb x11-xkb-utils xkb-data
  script:
    - meson setup build --buildtype=$BUILD_TYPE -Db_ndebug=if-release -Dwerror=true
    - meson compile -C build
    - meson test -C build config size-hints layout workspaces keyboard actions status mortarbar --print-errorlogs

sanitizers:
  stage: test
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y g++ meson ninja-build pkg-config guile-3.0-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev libxkbcommon-x11-dev libxcb-xtest0-dev libjq-dev libpango1.0-dev ruby xvfb x11-xkb-utils xkb-data
  script:
    - meson setup build -Dwerror=true -Db_sanitize=address,undefined
    - meson compile -C build
    - ASAN_OPTIONS=fast_unwind_on_malloc=0 LSAN_OPTIONS=suppressions=$CI_PROJECT_DIR/tests/lsan.supp UBSAN_OPTIONS=halt_on_error=1 meson test -C build config size-hints layout workspaces keyboard actions status mortarbar --print-errorlogs

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection
